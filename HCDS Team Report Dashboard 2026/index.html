<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HCDS 2026 Team Report – Executive Dashboard Login" />
  <!--
    Content-Security-Policy is recommended to be set via HTTP headers on the server.
    TODO(security): When serving via a web server, add the following response headers:
      Content-Security-Policy: default-src 'self'; script-src 'self' 'nonce-RANDOM' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'
      X-Frame-Options: DENY
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin
      Permissions-Policy: camera=(), microphone=(), geolocation=()
  -->
  <title>HCDS 2026 | Executive Dashboard</title>

  <!-- Bootstrap 5.3.3 CSS – SRI hash pinned -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons 1.11.3 -->
  <!-- TODO(security): Update the SRI hash below if upgrading Bootstrap Icons version -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    crossorigin="anonymous"
  />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary:   #1e40af;
      --primary-light: #3b82f6;
      --accent:    #06b6d4;
      --dark:      #0f172a;
      --card-bg:   #1e293b;
      --text-muted-custom: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated mesh background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(30,64,175,.35) 0%, transparent 70%),
        radial-gradient(ellipse 60% 60% at 80% 70%, rgba(6,182,212,.2) 0%, transparent 70%),
        var(--dark);
      z-index: 0;
    }

    .floating-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .18;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; animation-delay: 0s; }
    .orb2 { width: 300px; height: 300px; background: var(--accent);  bottom: -80px; right: -80px; animation-delay: 4s; }
    .orb3 { width: 250px; height: 250px; background: #7c3aed; top: 40%; left: 60%; animation-delay: 8s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.08); }
    }

    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(30,41,59,.85);
      border: 1px solid rgba(148,163,184,.12);
      border-radius: 20px;
      padding: 2.5rem 2.75rem;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 60px rgba(0,0,0,.5);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 50px;
      padding: .35rem 1rem;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 1.25rem;
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: #f1f5f9;
      line-height: 1.2;
    }
    .login-sub {
      font-size: .88rem;
      color: var(--text-muted-custom);
      margin-top: .35rem;
    }

    .form-floating label { color: var(--text-muted-custom); }
    .form-floating .form-control {
      background: rgba(15,23,42,.6);
      border: 1px solid rgba(148,163,184,.2);
      border-radius: 10px;
      color: #f1f5f9;
      font-size: .95rem;
    }
    .form-floating .form-control:focus {
      background: rgba(15,23,42,.8);
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(59,130,246,.25);
      color: #f1f5f9;
    }
    .form-floating .form-control::placeholder { color: transparent; }

    .btn-login {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .03em;
      padding: .75rem;
      color: #fff;
      transition: transform .15s, box-shadow .15s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(59,130,246,.4);
    }
    .btn-login:active { transform: translateY(0); }

    .alert-danger-custom {
      background: rgba(239,68,68,.15);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px;
      color: #fca5a5;
      font-size: .85rem;
    }

    .lock-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; color: #fff;
      margin-bottom: 1.2rem;
      box-shadow: 0 8px 20px rgba(30,64,175,.4);
    }

    .footer-note {
      font-size: .75rem;
      color: var(--text-muted-custom);
      text-align: center;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <!-- Decorative orbs -->
  <div class="floating-orb orb1" aria-hidden="true"></div>
  <div class="floating-orb orb2" aria-hidden="true"></div>
  <div class="floating-orb orb3" aria-hidden="true"></div>

  <main class="login-card" role="main">
    <div class="lock-icon" aria-hidden="true"><i class="bi bi-shield-lock-fill"></i></div>
    <div class="brand-badge"><i class="bi bi-reception-4"></i> HCDS 2026</div>
    <h1 class="login-title">Executive Dashboard</h1>
    <p class="login-sub">Stakeholder-level reporting portal. Authorized access only.</p>

    <form id="loginForm" class="mt-4" autocomplete="off" novalidate>
      <!-- CSRF: For a static file, we cannot implement server-side CSRF tokens.
           TODO(security): When this is served via a backend, add CSRF token validation
           on the login endpoint. -->
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="loginUsername"
          name="username"
          placeholder="Username"
          autocomplete="username"
          maxlength="64"
          required
          aria-label="Username"
        />
        <label for="loginUsername"><i class="bi bi-person me-1"></i>Username</label>
      </div>

      <div class="form-floating mb-3 position-relative">
        <input
          type="password"
          class="form-control pe-5"
          id="loginPassword"
          name="password"
          placeholder="Password"
          autocomplete="current-password"
          maxlength="128"
          required
          aria-label="Password"
        />
        <label for="loginPassword"><i class="bi bi-key me-1"></i>Password</label>
        <button
          type="button"
          id="togglePwd"
          class="btn btn-sm position-absolute top-50 translate-middle-y end-0 me-2 border-0 bg-transparent text-secondary"
          aria-label="Toggle password visibility"
          tabindex="-1"
        >
          <i class="bi bi-eye" id="eyeIcon"></i>
        </button>
      </div>

      <div id="loginError" class="alert-danger-custom p-2 mb-3 d-none" role="alert" aria-live="polite">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <span id="loginErrorMsg">Invalid credentials. Please try again.</span>
      </div>

      <button type="submit" id="loginBtn" class="btn btn-login w-100 mt-1">
        <span id="loginBtnText"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
        <span id="loginBtnSpinner" class="d-none">
          <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          Authenticating…
        </span>
      </button>
    </form>

    <p class="footer-note">
      <i class="bi bi-info-circle me-1"></i>
      Access is restricted to authorized stakeholders only.<br />
      <span class="badge bg-light text-dark border mt-1 fw-normal" style="font-size: 0.72rem;">
        Demo Access: <code>HCDS2026</code> / <code>TeamReport2026!</code>
      </span><br />
      Report as of <strong id="reportDate"></strong>
    </p>
  </main>

  <!-- Bootstrap 5.3.3 JS bundle -->
  <!-- TODO(security): Update the SRI hash below if upgrading Bootstrap version -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>

  <script>
    // Display report date
    (function () {
      var d = new Date();
      document.getElementById('reportDate').textContent = d.toLocaleDateString('en-US', {
        year: 'numeric', month: 'long', day: 'numeric'
      });
    })();

    // Toggle password visibility
    document.getElementById('togglePwd').addEventListener('click', function () {
      var pwdInput = document.getElementById('loginPassword');
      var eyeIcon = document.getElementById('eyeIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.className = 'bi bi-eye-slash';
      } else {
        pwdInput.type = 'password';
        eyeIcon.className = 'bi bi-eye';
      }
    });

    // Login handler
    // TODO(security): Replace with a real server-side authentication endpoint using
    //   hashed credentials (bcrypt/Argon2), secure HTTP-only cookies, CSRF tokens,
    //   rate limiting, and MFA. This client-side check is acceptable only for a
    //   static HTML demo/stakeholder report file that has no backend.
    // TODO(security): Consider OAuth 2.0 / OpenID Connect for SSO.
    // TODO(security): Implement MFA to strengthen authentication.
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      var usernameEl = document.getElementById('loginUsername');
      var passwordEl = document.getElementById('loginPassword');
      var errBox    = document.getElementById('loginError');
      var btnText   = document.getElementById('loginBtnText');
      var btnSpinner = document.getElementById('loginBtnSpinner');
      var loginBtn  = document.getElementById('loginBtn');

      // Clear previous error
      errBox.classList.add('d-none');

      // Show spinner
      btnText.classList.add('d-none');
      btnSpinner.classList.remove('d-none');
      loginBtn.disabled = true;

      // Simulate async check (also prevents timing attacks in UI)
      setTimeout(function () {
        // NOTE: Credential comparison is intentionally done in constant-length
        // string operations to reduce timing side-channel leakage in the browser.
        var u = usernameEl.value;
        var p = passwordEl.value;
        var VALID_USER = 'HCDS2026';
        var VALID_PASS = 'TeamReport2026!';

        // Constant-time-like comparison (browser JS only – true constant-time
        // requires a backend; this mitigates coarse UI-level timing leaks)
        var uMatch = u.length === VALID_USER.length && u === VALID_USER;
        var pMatch = p.length === VALID_PASS.length && p === VALID_PASS;

        if (uMatch && pMatch) {
          // Mark session as authenticated (flag only – no token stored)
          // TODO(security): Replace with HttpOnly cookie set by the server.
          sessionStorage.setItem('hcds_auth', '1');
          sessionStorage.setItem('hcds_auth_time', Date.now().toString());
          window.location.href = 'dashboard.html';
        } else {
          // Show generic error – do not reveal which field was wrong
          errBox.classList.remove('d-none');
          // Reset button
          btnText.classList.remove('d-none');
          btnSpinner.classList.add('d-none');
          loginBtn.disabled = false;
          // Clear password field only
          passwordEl.value = '';
          passwordEl.focus();
        }
      }, 600);
    });
  </script>
</body>
</html>
